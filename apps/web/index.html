<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lumen — ensoleillement</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <form id="recherche">
      <input id="q" type="search" placeholder="Adresse (ex. 12 rue Mouffetard, Paris)" autocomplete="off" />
      <button>OK</button>
      <ul id="suggestions"></ul>
    </form>
    <div id="panneau">
      <div id="statut">Saisis une adresse pour commencer.</div>
      <div class="ligne">
        <input id="jour" type="date" />
        <button id="lecture" type="button">▶</button>
        <span id="heureTxt"></span>
      </div>
      <input id="heure" type="range" min="0" max="1439" step="5" />
      <div id="selection" hidden>
        <div id="infoBat"></div>
        <div class="ligne">
          <label>Étage <input id="etage" type="number" min="0" max="60" value="2" /></label>
          <label>Hauteur d'étage <input id="hEtage" type="number" min="2.4" max="5" step="0.1" value="3" /> m</label>
        </div>
        <div id="infoFacade">Touche une façade pour placer la fenêtre.</div>
        <button id="calculer" type="button" disabled>Calculer l'ensoleillement</button>
      </div>
      <div id="resultat"></div>
      <div class="mention">Données © IGN (BD TOPO, Géoplateforme) — Licence Ouverte 2.0</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
